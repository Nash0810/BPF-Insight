name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev

      - name: Build
        run: make build

      - name: Run tests
        run: make test || true  # Tests may not be available yet

      - name: Verify binary
        run: |
          if [ -f ./bin/bpfva ]; then
            echo "✓ Binary built successfully"
            ./bin/bpfva --help || true
          else
            echo "✗ Binary not found"
            exit 1
          fi
